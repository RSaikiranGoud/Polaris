name: Polaris Kubernetes Audit
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audit Kubernetes manifests using Polaris
        run: |
          docker run --rm \
            -v "$PWD/deploy:/manifests:ro" \
            us-docker.pkg.dev/fairwinds-ops/oss/polaris:v10.2.0 \
            polaris audit --audit-path /manifests --format=pretty
